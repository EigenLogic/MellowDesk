name: Bug report
description: Report a reproducible problem in MellowDesk.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MellowDesk. Do not attach camera images, face data, private health information, credentials, or your workout-history file.
  - type: input
    id: version
    attributes:
      label: MellowDesk version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Camera or motion counting
        - Notifications
        - Workout flow
        - History or settings
        - Launch at login
        - Build or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include only the minimum steps needed to see the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, face, camera, health, credential, and local-history data from this report.
          required: true
